<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>废楼联合祓除 · 战斗样板</title><link rel="stylesheet" href="combat-sample.css"></head><body><main>
<header><div><p class="eyebrow">战斗样板 01 · 近战与远程</p><h1>废楼联合祓除</h1></div><a href="./">返回游戏 ↗</a></header>
<section class="battle"><div class="battle-top"><div id="order" aria-label="行动顺序"></div><p id="intent">敌方意图 · 重击虎杖</p></div>
<div class="arena"><div id="mount"></div><div class="location">残秽追踪 / 废弃大楼</div><button id="target" hidden aria-label="选择二级咒灵" aria-pressed="false"><span>二级咒灵</span><b>⌄</b></button><div id="numbers" aria-hidden="true"></div><div id="entry"><p class="eyebrow">虎杖悠仁 × 钉崎野蔷薇</p><h2 id="entryTitle">近身破敌，远程接应</h2><p id="loadStatus">点选咒灵，体验冲刺重拳与锤钉共鸣。</p><button id="start">进入战斗</button><small>独立样板 · 不读写旅程存档</small></div></div>
<div id="fighters" aria-label="双方状态"></div>
<div class="command-deck"><div class="command-caption"><span id="actor">准备出战</span><p id="status" role="status" aria-live="polite">进入战斗后，点击敌人选择目标</p></div><div class="buttons"><button id="attack" disabled aria-describedby="description">攻击</button><button id="guard" disabled aria-describedby="description">防御</button></div><p id="description">虎杖贴身出拳，钉崎留在后排敲钉。</p></div></section>
<footer><div><button id="sound" aria-pressed="true">音效 · 开</button><label>音量 <input id="volume" aria-label="音效音量" type="range" min="0" max="100" value="45"></label><label><input id="reduced" type="checkbox">减少动态</label></div><button id="reset" disabled>重新挑战</button></footer><p class="note">先让每一次攻击清楚地接近、命中、受击和归位。空格或 Enter 可发动当前角色攻击。 <a href="combat-audio-sources.html" target="_blank" rel="noopener">音效来源</a></p>
</main><script src="combat-audio.js"></script><script src="combat-sample-model.js"></script><script src="combat-sample.js"></script></body></html>
