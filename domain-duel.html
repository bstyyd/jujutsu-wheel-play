<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a23"><title>领域迎击 · 咒术轮盘</title><link rel="stylesheet" href="tokens.css?v=web-20261001T095751Z"><link rel="stylesheet" href="combat-sample.css?v=web-20261001T095751Z"><link rel="stylesheet" href="player-battle.css?v=web-20261001T095751Z"><link rel="stylesheet" href="fx.css?v=web-20261001T095751Z"><link rel="stylesheet" href="domain-effects.css?v=web-20261001T095751Z"><link rel="stylesheet" href="domain-duel.css?v=web-20261001T095751Z"><link rel="stylesheet" href="domain-realtime.css?v=web-20261001T095751Z"></head><body>
<main><header><div><p class="eyebrow">咒术战斗演练</p><h1>领域迎击<span>把握结界交锋的一瞬</span></h1></div><a class="back" href="./">返回旅程 ↗</a></header>
<section class="duel-config" aria-label="领域演练配置"><label>演练场景<select id="scenario"></select></label><label>玩家形象<select id="profile"></select></label><label>随身咒具<select id="equipment"><option value="">徒手</option></select></label><button id="randomize">随机形象 ↻</button><p id="buildSummary"></p><small>使用真实战斗规则；对手面板按演练调整，不代表原著强弱。不读写旅程存档。</small></section>
<section class="battle" aria-label="领域对攻战斗"><div class="battle-top"><span id="round">准备出战</span><div id="order" aria-label="行动顺序"></div><span class="edition">己方左 · 敌方右</span></div><p id="objective" class="duel-objective"></p>
<div class="battle-body"><div class="field"><div class="arena"><div id="mount"></div><div class="location" id="location"></div><div id="targets"></div><div id="numbers" aria-hidden="true"></div><div id="callout" aria-hidden="true"></div><div id="entry"><p class="eyebrow">你 · 生得术式</p><h2>迎接领域展开</h2><p id="loadStatus">准备人物与舞台</p><button id="start">进入战斗</button></div><div id="result" hidden><p class="eyebrow" id="resultKicker"></p><h2 id="resultTitle"></h2><div id="resultRewards"></div><p>本次演练成果只属于这一场，不写入存档。</p><button id="again">再次挑战</button></div></div>
<section id="domainLedger" class="duel-ledger" aria-label="领域状态" aria-live="polite"></section><div class="teams"><div><p class="side-label">我方</p><div id="allies" class="fighters"></div></div><div><p class="side-label enemy-label">敌方 · 点击选中</p><div id="enemies" class="fighters"></div></div></div></div>
<aside class="command-deck"><p class="eyebrow">当下的选择</p><h2 id="actor">准备迎击</h2><p id="status" role="status"></p><section id="reaction" class="duel-reaction" hidden><p class="eyebrow">敌方领域来袭</p><h3 id="reactionName"></h3><p id="reactionTrait"></p><p id="forecast"></p><div><button id="counter">展开迎击</button><button id="accept">保留领域</button></div><small>保留领域将承受对方特性，可在自己的行动再决定。</small></section>
<div class="commands" id="commands"><button id="attack" disabled><strong>攻击施术者</strong><small>命中削弱稳定度</small></button><button id="skill" disabled><strong>生得术式</strong><small></small></button><button id="domain" disabled><strong>领域展开</strong><small></small></button><button id="guard" disabled><strong>防御稳固</strong><small>恢复咒力 / 稳定结界</small></button></div><div id="barrierOptions"></div><p id="description"></p><div class="intent-box"><p class="eyebrow">战况提示</p><p id="tactic"></p></div><details class="rules"><summary>战斗记录</summary><ol id="battleLog"></ol></details></aside></div>
<footer><div class="settings"><button id="sound" aria-pressed="true">音效 · 开</button><label><input type="checkbox" id="voice" checked>角色原声</label><label><input type="checkbox" id="reduced">减少动态</label></div><button id="reset" disabled>重新挑战</button></footer></section>
<p class="note">演练玩家已领悟黑闪；接触攻击仍需概率触发。原作人物与领域，玩家参与、回合数与数值属于游戏改编。<a href="domain-review.html">查看全部角色展开演出 ↗</a></p></main>
