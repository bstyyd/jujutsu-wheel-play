<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>剧情战场 · 咒术回战</title><link rel="stylesheet" href="battle-art-review.css"><style>
.stage{width:100%;height:auto;aspect-ratio:16/9;min-height:260px;background-position:center;background-size:cover}.stage iframe{opacity:0;transition:opacity .3s}.stage.loaded iframe{opacity:1}.toolbar{grid-template-columns:minmax(200px,2fr) minmax(180px,1fr)}.actions{flex-wrap:wrap}#place{margin:0;color:#dfc58c;font-size:clamp(17px,2vw,25px)}#hint{color:#aabac4}footer a{color:#dfc58c}@media(max-width:600px){.toolbar{grid-template-columns:1fr}.stage{min-height:240px}}
</style></head><body><main>
<header><div><p class="eyebrow">剧情战场</p><h1>随故事，进入战场</h1><p>选择地点查看角色站位；有专属领域的角色可展开领域，再回到原战场。</p></div><a href="/">返回游戏 ↗</a></header>
<section class="toolbar"><label>剧情地点<select id="location"></select></label><div><h2 id="place"></h2><p id="cast"></p></div></section>
<section class="stage" id="stageBox"><iframe id="stage" title="剧情战斗场景预览" src="godot/embed.html" sandbox="allow-scripts allow-same-origin"></iframe><p id="status" role="status">正在载入战斗舞台…</p></section>
<nav class="actions"><button id="attack">试一次攻击</button><button id="domain">领域展开</button><button id="restore" disabled>回到原战场</button><label><input id="group" type="checkbox"> 增加同伴</label></nav>
<p id="hint">背景采用二维绘景，人物维持现有待机与攻击演出。</p>
<footer>按原作地点与参考画面改编为横向战场；具体镜头构图为游戏适配。<a href="battle-art-review.html">角色动作排练 ↗</a></footer>
</main><script src="battle-scenes.js"></script><script src="scene-review.js"></script></body></html>
