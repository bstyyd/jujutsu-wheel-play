<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>领域展开 · 战场内演出</title><link rel="stylesheet" href="tokens.css?v=web-20261001T095751Z"><link rel="stylesheet" href="fx.css?v=web-20261001T095751Z"><link rel="stylesheet" href="domain-effects.css?v=web-20261001T095751Z"><link rel="stylesheet" href="domain-realtime.css?v=web-20261001T095751Z"><link rel="stylesheet" href="domain-stage-review.css?v=web-20261001T095751Z"></head><body>
<main><header><a href="./">← 返回旅程</a><span>战场内领域演出 · 全领域</span></header><div class="intro"><p class="eyebrow">領域展開</p><h1>让领域，吞没战场。</h1><p>展开、维持、崩解都有各自的主题效果。可切换19种领域，或组合双方进行对攻。</p></div>
<div class="choices" aria-label="演出基准"><button data-case="void" aria-pressed="true">五条悟<small>无量空处</small></button><button data-case="shrine" aria-pressed="false">15指宿傩<small>伏魔御厨子</small></button><button data-case="shadow" aria-pressed="false">伏黑惠<small>嵌合暗翳庭</small></button><button data-case="clash" aria-pressed="false">领域对攻<small>无量空处 × 伏魔御厨子</small></button></div>
<div class="domain-picker"><label for="domainSelect">更多领域</label><select id="domainSelect"><optgroup id="canonDomains" label="原作 / 授权游戏场景"></optgroup><optgroup id="extraDomains" label="未公开全貌 / 游戏扩展 · 保留战场"></optgroup></select></div>
<section class="stage-panel"><div class="stage-top"><span id="place">涉谷街道</span><span id="space">常规战场</span></div><div class="stage-arena" id="arena"><iframe id="stage" title="领域演出舞台" src="godot/embed.html" sandbox="allow-scripts allow-same-origin"></iframe><p id="loading">正在载入战场</p></div><div class="stage-bottom"><div><span id="status" role="status">准备角色与场景</span><p id="note">空间扩散 · 信息流穿过战场</p></div><button id="expand" disabled>领域展开</button><button id="endDomain" disabled>收起领域</button><button id="clear" disabled>重置</button></div></section>
<section id="clashControls" hidden><div class="clash-picker"><label>我方领域<select id="clashAlly"></select></label><span>×</span><label>敌方领域<select id="clashEnemy"></select></label></div><div class="clash-controls" id="stabilityControls"><label>我方结界稳定度<input id="stabilityAlly" type="range" min="1" max="100" value="100"><output id="allyValue">100</output></label><label>敌方结界稳定度<input id="stabilityEnemy" type="range" min="1" max="100" value="100"><output id="enemyValue">100</output></label><button id="breakEnemy">敌方结界崩解</button></div><p class="fine">这里的滑块仅供审核空间争夺效果；实战边界使用战斗中真实的稳定度。</p></section>
<footer><label><input type="checkbox" id="voice" checked>角色原声</label><label><input type="checkbox" id="motion" checked>动态演出</label><a href="domain-duel.html">用随机玩家实际迎击 ↗</a><a href="domain-review.html">全部领域图片 ↗</a></footer><p class="fine">这页只预览演出，不读写存档。原声按角色匹配，缺声保持静默。特写限定原对应阶段；未公开领域的术式演绎不作为原作场景。</p></main>
<div hidden><dialog id="menuDialog"></dialog><div><button id="motionToggle"></button></div></div>
